# Raises the caps on UDP socket buffer sizes so that libquic can get the larger
# SO_RCVBUF/SO_SNDBUF it asks for: without root, setsockopt is silently limited
# to these values, and the kernel defaults (about 208 KB) drop packets under
# load.
#
# To change these, do not edit this file (it is replaced on upgrade).  Instead:
# - create /etc/sysctl.d/30-libquic.conf, which replaces this file entirely
#   (make it a symlink to /dev/null to disable it), or
# - set individual keys in a file that sorts later, such as
#   /etc/sysctl.d/60-libquic.conf (60-90 is the range for local settings), or
#   in /etc/sysctl.conf.
net.core.rmem_max = 16777216
net.core.wmem_max = 2097152
